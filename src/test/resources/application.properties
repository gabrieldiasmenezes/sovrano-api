

# Use the real Postgres service (docker-compose) for integration tests
spring.datasource.url=jdbc:postgresql://localhost:5432/sovrano_db
spring.datasource.username=sovrano_user
spring.datasource.password=sovrano_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


